name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the full-stack tests still catch upstream stack drift on a
    # quiet repo.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      stack-tests:
        description: Also run the tests that need a full stack (slow)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    # Pinned to @main because elastic-package-workflows has no tag yet; move
    # this to @v1 once it cuts one.
    uses: NateShoffner/elastic-package-workflows/.github/workflows/ci.yml@main
    with:
      package: packages/netgear_genie
      # Keeps the version the old workflow pinned. The shared default is
      # v0.126.4, which boots stack 9.5.3, and on agent 9.5.3 the status data
      # stream's CEL program fails to compile ("failed compilation: ERROR:
      # <input>:125:10860: Syntax error: mismatched input '<EOF>'"), so the
      # input never starts and its system test collects no documents. channel
      # and event_log are unaffected. Drop this pin once that is fixed.
      elastic-package-version: v0.125.1
      # TEMPORARY: forced on so this pull request exercises the full-stack
      # tests. Before merging, drop this line and restore the one below.
      stack-tests: true
      # stack-tests: ${{ github.event_name == 'schedule' || inputs.stack-tests == true }}
