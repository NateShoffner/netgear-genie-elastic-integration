            - '/GenieIndex.asp'
        body: ''
  - path: /stuck/DocsisStatus.asp
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'text/html'
        body: |-
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <META http-equiv="Content-Type" content="text/html; charset=utf-8">
              <meta name="description" content='CM1000v2'>
              <META http-equiv="Content-Style-Type" content="text/css">
              <META http-equiv="Pragma" content="no-cache">
              <META HTTP-equiv="Cache-Control" content="no-cache">
              <META HTTP-EQUIV="Expires" CONTENT="Mon, 06 Jan 1990 00:00:01 GMT">
              <script type="text/javascript">
                  function redirectPage()
                  {
                      window.top.location = "/GenieLogin.asp";
                  }
              </script>
          </head>
          <body onload="redirectPage();">
          </body>
          </html>
  # The DOCSIS status page answers with an unexpected HTTP status, selected with
  # a `/httperr` base URL.
  - path: /httperr/GenieLogin.asp
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
