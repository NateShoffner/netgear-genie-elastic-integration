          {{- else }}
                          var xmlFormat = '<docsDevEventTable><tr><docsDevEvIndex>1</docsDevEvIndex><docsDevEvFirstTime>2026-09-22, 03:30:12</docsDevEvFirstTime><docsDevEvLastTime>2026-09-22, 03:30:12</docsDevEvLastTime><docsDevEvCounts>1</docsDevEvCounts><docsDevEvLevel>Critical (3)</docsDevEvLevel><docsDevEvId>82000200</docsDevEvId><docsDevEvText>No Ranging Response received - T3 time-out;CM-MAC=00:00:5e:00:53:01;CMTS-MAC=00:00:5e:00:53:02;CM-QOS=1.1;CM-VER=3.1;</docsDevEvText></tr><tr><docsDevEvIndex>2</docsDevEvIndex><docsDevEvFirstTime>2026-08-31, 08:00:55</docsDevEvFirstTime><docsDevEvLastTime>2026-09-22, 03:29:58</docsDevEvLastTime><docsDevEvCounts>97</docsDevEvCounts><docsDevEvLevel>Critical (3)</docsDevEvLevel><docsDevEvId>82000500</docsDevEvId><docsDevEvText>Started Unicast Maintenance Ranging - No Response received - T3 time-out;CM-MAC=00:00:5e:00:53:01;CMTS-MAC=00:00:5e:00:53:02;CM-QOS=1.1;CM-VER=3.1;</docsDevEvText></tr><tr><docsDevEvIndex>3</docsDevEvIndex><docsDevEvFirstTime>2026-08-31, 08:00:52</docsDevEvFirstTime><docsDevEvLastTime>2026-08-31, 08:00:52</docsDevEvLastTime><docsDevEvCounts>1</docsDevEvCounts><docsDevEvLevel>Warning (5)</docsDevEvLevel><docsDevEvId>85010200</docsDevEvId><docsDevEvText>TCS Partial Service;CM-MAC=00:00:5e:00:53:01;CMTS-MAC=00:00:5e:00:53:02;CM-QOS=1.1;CM-VER=3.1;</docsDevEvText></tr><tr><docsDevEvIndex>4</docsDevEvIndex><docsDevEvFirstTime>2026-08-31, 08:00:30</docsDevEvFirstTime><docsDevEvLastTime>2026-08-31, 08:00:51</docsDevEvLastTime><docsDevEvCounts>110</docsDevEvCounts><docsDevEvLevel>Critical (3)</docsDevEvLevel><docsDevEvId>85000200</docsDevEvId><docsDevEvText>UCD invalid or channel unusable;CM-MAC=00:00:5e:00:53:01;CMTS-MAC=00:00:5e:00:53:02;CM-QOS=1.1;CM-VER=3.1;</docsDevEvText></tr><tr><docsDevEvIndex>5</docsDevEvIndex><docsDevEvFirstTime>2026-08-31, 07:59:52</docsDevEvFirstTime><docsDevEvLastTime>2026-08-31, 07:59:52</docsDevEvLastTime><docsDevEvCounts>1</docsDevEvCounts><docsDevEvLevel>Notice (6)</docsDevEvL