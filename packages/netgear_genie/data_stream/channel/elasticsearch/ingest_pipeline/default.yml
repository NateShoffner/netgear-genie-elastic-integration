---
description: Pipeline for processing NETGEAR Genie cable modem DOCSIS channel metrics.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - remove:
      field: _conf
      ignore_missing: true
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      tag: remove_conf_on_data_collection_error
      description: Removes the agent configuration fields from collector error documents before processing stops.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null

  # The status page carries no per-channel timestamp, so each row is stamped
  # with the time the poll reached Elasticsearch.
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_ingest
      value: '{{{_ingest.timestamp}}}'
      description: The DOCSIS status page reports a live snapshot without a timestamp, so the ingest time is used.

  - set:
      field: event.kind
      tag: set_event_kind
      value: metric
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: NETGEAR
  - set:
      field: observer.type
      tag: set_observer_type
      value: modem

  # Channel identity. `type` and `modulation_type` tell the four channel table
  # shapes apart: downstream/upstream crossed with sc_qam, ofdm and ofdma.
  - rename:
      field: json.type
      target_field: netgear_genie.channel.type
      ignore_missing: true
      tag: rename_type
  - rename:
      field: json.modulation_type
      target_field: netgear_genie.channel.modulation_type
      ignore_missing: true
      tag: rename_modulation_type
  - convert:
      field: json.channel
      target_field: netgear_genie.channel.channel
      type: long
      ignore_missing: true
      tag: convert_channel
      if: ctx.json?.channel != ''
  - convert:
      field: json.channel_id
      target_field: netgear_genie.channel.channel_id
      type: long
      ignore_missing: true
      tag: convert_channel_id
      if: ctx.json?.channel_id != ''

  # Lock status is kept verbatim and mirrored into a boolean so dashboards can
  # count the locked channels without matching on the modem's wording.
  - rename:
      field: json.lock_status
      target_field: netgear_genie.channel.lock_status
      ignore_missing: true
      tag: rename_lock_status
  - set:
      field: netgear_genie.channel.locked
      tag: set_locked_true
      value: true
      if: ctx.netgear_genie?.channel?.lock_status != null && ctx.netgear_genie.channel.lock_status.equalsIgnoreCase('locked')
  - set:
      field: netgear_genie.channel.locked
      tag: set_locked_false
      value: false
      if: ctx.netgear_genie?.channel?.lock_status != null && !ctx.netgear_genie.channel.lock_status.equalsIgnoreCase('locked')

  # Single carrier QAM channels report a modulation, OFDM and OFDMA channels
  # report the profile identifiers active on the channel instead.
  - rename:
      field: json.modulation
      target_field: netgear_genie.channel.modulation
      ignore_missing: true
      tag: rename_modulation
  - grok:
      field: json.profile_ids
      patterns:
        - '^%{PROFILE_IDS:_tmp.profile_ids}$'
      pattern_definitions:
        PROFILE_IDS: '\d+(?:\s*,\s*\d+)*'
      ignore_failure: true
      tag: grok_profile_ids
      if: ctx.json?.profile_ids != null && ctx.json.profile_ids != ''
      description: Keeps the profile identifier list only when it is numeric; unused slots report a placeholder such as `Unknown`.
  - split:
      field: _tmp.profile_ids
      target_field: netgear_genie.channel.profile_ids
      separator: '\s*,\s*'
      ignore_missing: true
      tag: split_profile_ids

  # Measurements are rendered with their unit, for example "801000000 Hz",
  # "-4.9 dBmV" and "42.3 dB". Rows for unused slots report zeros or a
  # placeholder, so a row that does not carry a number is left unset.
  - grok:
      field: json.frequency
      patterns:
        - '^%{NUMBER:netgear_genie.channel.frequency:long}\s*Hz$'
      ignore_failure: true
      tag: grok_frequency
      if: ctx.json?.frequency != null && ctx.json.frequency != ''
  - grok:
      field: json.power
      patterns:
        - '^%{NUMBER:netgear_genie.channel.power:double}\s*dBmV$'
      ignore_failure: true
      tag: grok_power
      if: ctx.json?.power != null && ctx.json.power != ''
  - grok:
      field: json.snr
      patterns:
        - '^%{NUMBER:netgear_genie.channel.snr:double}\s*dB$'
      ignore_failure: true
      tag: grok_snr
      if: ctx.json?.snr != null && ctx.json.snr != ''

  # OFDM channels report the active subcarrier numbers as "268 ~ 3827". Keep
  # the range as the modem renders it and split out its bounds.
  - grok:
      field: json.subcarrier_range
      patterns:
        - '^%{NUMBER:netgear_genie.channel.subcarrier_range_start:long}\s*~\s*%{NUMBER:netgear_genie.channel.subcarrier_range_end:long}$'
      ignore_failure: true
      tag: grok_subcarrier_range
      if: ctx.json?.subcarrier_range != null && ctx.json.subcarrier_range != ''
  - rename:
      field: json.subcarrier_range
      target_field: netgear_genie.channel.subcarrier_range
      ignore_missing: true
      tag: rename_subcarrier_range

  # Codeword counters are cumulative since the modem booted and exceed 2^32.
  - convert:
      field: json.unerrored_codewords
      target_field: netgear_genie.channel.unerrored_codewords
      type: long
      ignore_missing: true
      tag: convert_unerrored_codewords
      if: ctx.json?.unerrored_codewords != ''
  - convert:
      field: json.correctable_codewords
      target_field: netgear_genie.channel.correctable_codewords
      type: long
      ignore_missing: true
      tag: convert_correctable_codewords
      if: ctx.json?.correctable_codewords != ''
  - convert:
      field: json.uncorrectable_codewords
      target_field: netgear_genie.channel.uncorrectable_codewords
      type: long
      ignore_missing: true
      tag: convert_uncorrectable_codewords
      if: ctx.json?.uncorrectable_codewords != ''

  - remove:
      field:
        - json
        - _tmp
        - _conf
      ignore_missing: true
      tag: remove_temporary_fields
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      tag: append_preserve_original_event_on_error
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - remove:
      field:
        - json
        - _tmp
        - _conf
      ignore_missing: true
      tag: remove_temporary_fields_on_failure
