title: "DOCSIS channels"
type: metrics
streams:
  - input: cel
    title: DOCSIS channels
    description: Collect the DOCSIS downstream, upstream, OFDM and OFDMA channel metrics from the Genie web interface.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: How often the DOCSIS status page is polled. Supported units for this parameter are h/m/s.
        required: true
        show_user: true
        default: 5m
      - name: take_over_session
        type: bool
        title: Take over the modem web session
        description: The modem allows only one web interface session at a time. When enabled, the integration takes the session over if another device holds it, which logs that device out of the modem's web interface.
        multi: false
        required: true
        show_user: true
        default: true
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: The request tracer logs HTTP requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - netgear_genie-channel
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
elasticsearch:
  index_template:
    mappings:
      subobjects: false
